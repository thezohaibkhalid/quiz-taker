<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="logoGrad" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#logoGrad)" />
  <!-- Stylized graduation cap with checkmark -->
  <g fill="#ffffff">
    <!-- Main cap top -->
    <path d="M 32 15 L 53 25 L 32 35 L 11 25 Z" opacity="0.95" />
    <!-- Cap under/base -->
    <path d="M 21 29.5 V 36 C 21 40, 43 40, 43 36 V 29.5 L 32 35 Z" />
    <!-- Tassel -->
    <path d="M 43.5 28.5 L 48 31 V 42" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <polygon points="46,42 50,42 48,46" />
  </g>
  <!-- Bright contrast checkmark overlay -->
  <path d="M 23 27 L 30 34 L 46 17" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Inner checkmark accent core -->
  <path d="M 23 27 L 30 34 L 46 17" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
