# ==================================================================
# STAGING deployment pipeline
# Triggers: push to `staging` branch OR manual workflow_dispatch.
# Steps:
#   1. Checkout
#   2. Setup Node, install, lint, build (fail-fast)
#   3. Build Docker image
#   4. Push to GHCR (tagged `staging` + commit SHA)
#   5. SSH into staging host, pull image, docker compose up
#   6. Health check (rollback if unhealthy)
# ==================================================================

name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    name: Lint, Build, Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: https://cloud.dukandar.app
          MONGODB_URI: "mongodb://placeholder-for-build/only"
          JWT_SECRET: "build-time-placeholder"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          echo "image_repo=${{ env.REGISTRY }}/${REPO_LC}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ env.REGISTRY }}/${REPO_LC}:staging-${SHA}" >> $GITHUB_OUTPUT
          echo "image_tag_latest=${{ env.REGISTRY }}/${REPO_LC}:staging" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging host
    runs-on: ubuntu-latest
    needs: test-and-build
    environment:
      name: staging
      url: https://cloud.dukandar.app

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/quiz-system

            # Pull latest compose file from the repo (assumes repo cloned at /opt/quiz-system)
            git fetch --all
            git checkout staging
            git pull origin staging

            # Materialize .env.staging from the single blob secret.
            # Quoted heredoc delimiter prevents the VM shell from expanding $VAR inside the secret.
            cat > .env.staging <<'STAGING_ENV_EOF'
            ${{ secrets.STAGING_ENV_BLOB }}
            STAGING_ENV_EOF
            chmod 600 .env.staging

            # Pull image and bring stack up
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE="${{ needs.test-and-build.outputs.image_tag }}"
            docker compose -f docker-compose.staging.yml --env-file .env.staging pull
            docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --force-recreate

            # Wait + healthcheck
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -fsS http://localhost:4500/api/health > /dev/null; then
                echo "Healthy ✅"
                exit 0
              fi
              echo "Health check attempt $i failed — retrying…"
              sleep 5
            done
            echo "Health check FAILED — rolling back to previous tag"
            docker compose -f docker-compose.staging.yml --env-file .env.staging down
            docker tag ${{ needs.test-and-build.outputs.image_tag }} previous-broken || true
            exit 1
